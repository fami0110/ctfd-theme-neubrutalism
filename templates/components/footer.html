<footer class="footer">
  <div class="container-fluid">
    <div class="footer-shell">
      <div class="footer-meta">
        <p class="footer-kicker">{{ Configs.ctf_name }}</p>
        <small class="footer-note text-muted">
          {% trans %}Powered by CTFd{% endtrans %}
        </small>
      </div>
      <nav class="footer-links" aria-label="{% trans %}Event links{% endtrans %}">
        <a href="https://jti.polinema.ac.id/playit2026/" target="_blank" rel="noopener noreferrer" aria-label="{% trans %}Website{% endtrans %}">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3c2.2 2.5 3.3 5.5 3.3 9s-1.1 6.5-3.3 9c-2.2-2.5-3.3-5.5-3.3-9S9.8 5.5 12 3Z" />
          </svg>
        </a>
        <a href="https://www.instagram.com/playit_jti/" target="_blank" rel="noopener noreferrer" aria-label="{% trans %}Instagram{% endtrans %}">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="3" width="18" height="18" rx="4" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="1" class="footer-icon-fill" />
          </svg>
        </a>
        <a href="https://www.youtube.com/@JTIPlayIt" target="_blank" rel="noopener noreferrer" aria-label="{% trans %}Youtube{% endtrans %}">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 7.5a2.5 2.5 0 0 0-1.8-1.8C17.6 5.3 12 5.3 12 5.3s-5.6 0-7.2.4A2.5 2.5 0 0 0 3 7.5 26 26 0 0 0 2.6 12 26 26 0 0 0 3 16.5a2.5 2.5 0 0 0 1.8 1.8c1.6.4 7.2.4 7.2.4s5.6 0 7.2-.4a2.5 2.5 0 0 0 1.8-1.8 26 26 0 0 0 .4-4.5 26 26 0 0 0-.4-4.5Z" />
            <path d="m10 9 5 3-5 3V9Z" class="footer-icon-fill" />
          </svg>
        </a>
      </nav>
    </div>
  </div>
</footer>
